  <!DOCTYPE html>                                                                                                        
  <html lang="en">                                                                                                       
  <head>                                                                                                                 
  <meta charset="UTF-8">                                                                                                 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CEMENTED — Coming Soon</title>
  <meta name="description" content="Premium grooming subscription built for men of color. Launching soon.">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;700&family=DM+Sans:wgh
  t@300;400&display=swap" rel="stylesheet">
  <style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --cement:#E8D5A3;
    --raw:#0D0906;
    --terra:#A0522D;
    --terra-light:#C49A6C;
    --border:rgba(196,163,108,0.12);
  }
  html{height:100%}
  body{font-family:'DM Sans',sans-serif;background:var(--raw);color:var(--cement);min-height:100vh;display:flex;flex-dire
  ction:column;align-items:center;justify-content:center;padding:40px 24px;overflow:hidden;position:relative}

  /* noise */
  body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256'
  xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9'
  numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25'
  filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;opacity:.04;pointer-events:none;z-index:0}

  /* big bg letter */
  .bg-letter{position:fixed;font-family:'Bebas Neue',sans-serif;font-size:clamp(400px,60vw,800px);line-height:1;color:rgb
  a(160,82,45,.04);bottom:-80px;right:-60px;pointer-events:none;letter-spacing:-20px;z-index:0}

  .inner{position:relative;z-index:1;max-width:600px;width:100%;text-align:center}

  .logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,8vw,80px);letter-spacing:10px;color:var(--cement);margin
  -bottom:8px;animation:fadeUp .8s .1s both}

  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:5px;text-transform:upp
  ercase;color:var(--terra);margin-bottom:40px;animation:fadeUp .8s .2s
  both;display:flex;align-items:center;justify-content:center;gap:12px}
  .eyebrow::before,.eyebrow::after{content:'';display:block;width:20px;height:1px;background:var(--terra)}

  .headline{font-family:'Bebas
  Neue',sans-serif;font-size:clamp(56px,9vw,110px);line-height:.9;letter-spacing:3px;margin-bottom:20px;animation:fadeUp
  .8s .3s both}
  .headline span{color:var(--terra)}

  .sub{font-size:16px;font-weight:300;color:rgba(196,163,108,.55);line-height:1.75;max-width:400px;margin:0 auto
  48px;animation:fadeUp .8s .4s both}

  /* email form */
  .form-wrap{display:flex;gap:0;max-width:420px;margin:0 auto 16px;animation:fadeUp .8s .5s both;border:1px solid
  rgba(196,163,108,.15);border-radius:2px;overflow:hidden}
  .form-wrap input{flex:1;background:rgba(196,163,108,.06);border:none;padding:14px 18px;font-family:'DM
  Sans',sans-serif;font-size:15px;color:var(--cement);outline:none}
  .form-wrap input::placeholder{color:rgba(196,163,108,.3)}
  .form-wrap button{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:3px;text-tran
  sform:uppercase;background:var(--terra);color:var(--raw);border:none;padding:14px
  24px;cursor:pointer;white-space:nowrap;transition:background .2s}
  .form-wrap button:hover{background:var(--terra-light)}

  .form-note{font-size:12px;color:rgba(196,163,108,.25);animation:fadeUp .8s .6s both}

  .thanks{display:none;font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;text-t
  ransform:uppercase;color:var(--terra);padding:16px;animation:fadeUp .4s both}

  /* badge */
  .badge{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid
  var(--border);margin-top:52px;animation:fadeUp .8s .7s both}
  .badge-dot{width:5px;height:5px;border-radius:50%;background:var(--terra);animation:pulse 2s infinite}
  .badge-txt{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:3px;text-transform:u
  ppercase;color:rgba(232,213,163,.35)}

  /* socials */
  .socials{display:flex;gap:24px;justify-content:center;margin-top:28px;animation:fadeUp .8s .8s both}
  .socials a{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:3px;text-transform:u
  ppercase;color:rgba(196,163,108,.25);text-decoration:none;transition:color .2s}
  .socials a:hover{color:var(--terra)}

  @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  </head>
  <body>

  <div class="bg-letter">C</div>

  <div class="inner">
    <div class="logo">CEMENTED</div>
    <div class="eyebrow">Premium Grooming · Men of Color</div>
    <div class="headline">YOUR RITUAL<br>IS <span>COMING.</span></div>
    <div class="sub">The first premium grooming subscription built specifically for melanin-rich skin. Be first in
  line.</div>

    <form class="form-wrap" id="csForm" action="https://formspree.io/f/mwvnnbqo" method="POST" 
  onsubmit="handleSubmit(event)">
      <input type="email" name="email" placeholder="your@email.com" required aria-label="Email address"/>
      <button type="submit">Notify Me</button>
    </form>
    <div class="thanks" id="thanks">You're on the list. We'll be in touch.</div>
    <div class="form-note" id="formNote">No spam. First access when we launch.</div>

    <div class="badge">
      <div class="badge-dot"></div>
      <div class="badge-txt">Founding Member Spots — 40 Left</div>
    </div>

    <div class="socials">
      <a href="https://www.instagram.com/becemented" target="_blank">Instagram</a>
      <a href="#">TikTok</a>
    </div>
  </div>

  <script>
  function handleSubmit(e){
    e.preventDefault();
    const form=document.getElementById('csForm');
    const data=new FormData(form);
    fetch(form.action,{method:'POST',body:data,headers:{Accept:'application/json'}})
      .then(()=>{
        form.style.display='none';
        document.getElementById('formNote').style.display='none';
        document.getElementById('thanks').style.display='block';
      });
  }
  </script>
  </body>
  </html>
